<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #stage { position: relative; width: 100%; line-height: 0; overflow: hidden; border-radius: 14px; background: #111827; touch-action: none; }
    #image { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
    #region { position: absolute; border: 2px solid #0a84ff; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255,255,255,.92), 0 4px 18px rgba(10,132,255,.28); cursor: grab; touch-action: none; will-change: left, top; }
    #region::after { content: ""; position: absolute; inset: -10px; }
    #region.dragging { cursor: grabbing; border-color: #0077ed; box-shadow: 0 0 0 2px rgba(10,132,255,.26), 0 9px 24px rgba(10,132,255,.35); }
    #hint { margin: 8px 2px 0; color: #6e6e73; font-size: 12px; line-height: 1.35; }
    #region:focus-visible { outline: 3px solid #0a84ff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { #region { transition: none; } }
  </style>
</head>
<body>
  <div id="stage"><img id="image" alt="Kubios OCR 校准预览"><div id="region" role="slider" tabindex="0" aria-label="拖动识别区域" aria-valuetext="识别区域位置"></div></div>
  <div id="hint">拖动蓝色框以调整识别区域</div>
  <script>
    const stage = document.getElementById('stage');
    const image = document.getElementById('image');
    const regionEl = document.getElementById('region');
    let config = null;
    let region = null;
    let drag = null;

    function post(type, payload) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, '*');
    }
    function setHeight() { post('streamlit:setFrameHeight', { height: document.body.scrollHeight }); }
    function ready() { post('streamlit:componentReady', { apiVersion: 1 }); setHeight(); }
    function clamp(value, minimum, maximum) { return Math.max(minimum, Math.min(maximum, value)); }
    function render() {
      if (!region) return;
      regionEl.style.left = `${region.x * 100}%`;
      regionEl.style.top = `${region.y * 100}%`;
      regionEl.style.width = `${region.width * 100}%`;
      regionEl.style.height = `${region.height * 100}%`;
      regionEl.setAttribute('aria-valuetext', `区域位置 ${Math.round(region.x * 100)}%, ${Math.round(region.y * 100)}%`);
    }
    function publish() {
      post('streamlit:setComponentValue', { value: { x: region.x, y: region.y, width: region.width, height: region.height } });
    }
    function move(clientX, clientY) {
      const bounds = stage.getBoundingClientRect();
      region.x = clamp((clientX - bounds.left - drag.offsetX) / bounds.width, 0, 1 - region.width);
      region.y = clamp((clientY - bounds.top - drag.offsetY) / bounds.height, 0, 1 - region.height);
      render();
    }
    regionEl.addEventListener('pointerdown', (event) => {
      if (!region) return;
      event.preventDefault();
      const bounds = stage.getBoundingClientRect();
      drag = { pointerId: event.pointerId, offsetX: event.clientX - bounds.left - region.x * bounds.width, offsetY: event.clientY - bounds.top - region.y * bounds.height };
      regionEl.setPointerCapture(event.pointerId);
      regionEl.classList.add('dragging');
    });
    regionEl.addEventListener('pointermove', (event) => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      move(event.clientX, event.clientY);
    });
    function endDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      drag = null;
      regionEl.classList.remove('dragging');
      publish();
    }
    regionEl.addEventListener('pointerup', endDrag);
    regionEl.addEventListener('pointercancel', endDrag);
    regionEl.addEventListener('keydown', (event) => {
      if (!region) return;
      const step = event.shiftKey ? 0.01 : 0.002;
      if (event.key === 'ArrowLeft') region.x = clamp(region.x - step, 0, 1 - region.width);
      else if (event.key === 'ArrowRight') region.x = clamp(region.x + step, 0, 1 - region.width);
      else if (event.key === 'ArrowUp') region.y = clamp(region.y - step, 0, 1 - region.height);
      else if (event.key === 'ArrowDown') region.y = clamp(region.y + step, 0, 1 - region.height);
      else return;
      event.preventDefault(); render(); publish();
    });
    image.addEventListener('load', setHeight);
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.type !== 'streamlit:render') return;
      const args = data.args || {};
      config = args;
      if (!drag) {
        region = { ...args.region };
        if (image.src !== args.image_url) image.src = args.image_url;
        render();
      }
      setHeight();
    });
    ready();
  </script>
</body>
</html>
