function controlPracticeRun(){controlPracticeState='active';let data=task==='stroop_control'?[{word:0,color:1},{word:1,color:1},{word:2,color:3}]:task==='task_switching'?[{number:7,rule:'parity'},{number:2,rule:'magnitude'},{number:8,rule:'parity'}]:[{symbol:0,digit:1},{symbol:1,digit:2},{symbol:2,digit:3}],i=0;controlTimer=setTimeout(controlPracticeDone,5000);function next(){if(controlPracticeState!=='active'||i>=data.length)return controlPracticeDone();controlRender(data[i++],true,()=>{hint.textContent='正确';setTimeout(next,240)},()=>{hint.textContent=task==='stroop_control'?'请按字体颜色作答':task==='task_switching'?'注意顶部规则':'请查看上方对应表';setTimeout(next,300)})}next()}
function controlPracticeDone(){if(controlPracticeState!=='active')return;cc();controlPracticeState='summary';stage.innerHTML='<div class="gonogo-instruction"><h3>练习完成</h3><p class="small">练习数据不进入正式成绩。</p><div class="gonogo-actions"><button class="primary" id="ccRetry">再练一次</button><button class="primary" id="ccFormal">开始正式训练</button></div></div>';ccRetry.onclick=controlPractice;ccFormal.onclick=controlFormal;resize()}
function controlRender(x,practice,good,bad){stage.innerHTML='';let expected,options=[];if(task==='stroop_control'){expected=COLORS[x.color][0];stage.innerHTML=`<div class="control-stimulus" style="color:${COLORS[x.color][1]}">${COLORS[x.word][0]}</div><div class="small">1 红 · 2 蓝 · 3 绿 · 4 黄</div>`;options=COLORS.map((z,i)=>[z[0],String(i+1),z[1]])}else if(task==='task_switching'){let parity=x.rule==='parity',left=parity?x.number%2:x.number<5;expected=left?'left':'right';stage.innerHTML=`<div class="control-rule">当前规则：${parity?'奇数 / 偶数':'小于5 / 大于5'}</div><div class="control-stimulus">${x.number}</div><div class="small">← / A = 左　｜　→ / D = 右</div>`;options=[[parity?'奇数':'小于5','left'],[parity?'偶数':'大于5','right']]}else{expected=String(x.digit);let map=practice?SYMBOLS.slice(0,3).map((z,i)=>z[1]+' = '+(i+1)):SYMBOLS.map((z,i)=>z[1]+' = '+controlMap[i]);stage.innerHTML=`<div class="symbol-map">${map.join('　')}</div><div class="control-stimulus" aria-label="目标符号">${SYMBOLS[x.symbol][1]}</div><div class="small">按键 1—6</div>`;options=(practice?[1,2,3]:[1,2,3,4,5,6]).map(z=>[String(z),String(z)])}let row=document.createElement('div');row.className='control-choices '+(options.length===6?'six':'');let used=false,answer=v=>{if(used)return;used=true;v===expected?good(v,expected):bad(v,expected)};options.forEach(z=>{let b=document.createElement('button');b.className='choice color-choice';b.innerHTML=(z[2]?`<span class="swatch" style="background:${z[2]}"></span>`:'')+z[0];b.onclick=()=>answer(z[1]);row.appendChild(b)});stage.appendChild(row);window.onkeydown=e=>{let v=task==='stroop_control'?({'1':'红','2':'蓝','3':'绿','4':'黄'}[e.key]):task==='task_switching'?((e.key==='ArrowLeft'||e.key.toLowerCase()==='a')?'left':(e.key==='ArrowRight'||e.key.toLowerCase()==='d')?'right':null):(/^[1-6]$/.test(e.key)?e.key:null);if(v){e.preventDefault();answer(v)}};return expected}
function controlGenerate(){if(task==='stroop_control'){let a=[];for(let i=0;i<24;i++){let color=i%4,word=i%5<3?(color+i+1)%4:color;a.push({word,color,congruency:word===color?'congruent':'incongruent'})}return a.sort(()=>Math.random()-.5)}if(task==='task_switching'){let rules=['parity'];while(rules.length<24){let p=rules[rules.length-1],r=Math.random()<.5?(p==='parity'?'magnitude':'parity'):p;rules.push(r)}return rules.map((r,i)=>({rule:r,number:[1,2,3,4,6,7,8,9][(i*3+Math.floor(Math.random()*5))%8],switch_condition:i?'': 'initial',previous_rule:i?rules[i-1]:null})).map((x,i)=>({...x,switch_condition:i?'': 'initial'})).map((x,i)=>i?{...x,switch_condition:x.rule===x.previous_rule?'repeat':'switch'}:x)}controlMap=[1,2,3,4,5,6].sort(()=>Math.random()-.5);controlMapId='map_'+controlMap.join('')+'_'+Date.now();return [...Array(30)].map((_,i)=>({symbol:i%6,digit:controlMap[i%6]})).sort(()=>Math.random()-.5)}
function controlFormal(){cc();controlPracticeState=null;trials=[];controlQueue=controlGenerate();stage.innerHTML='';hint.textContent='保持准确与稳定；请勿切换页面。';setup(cfg.session_mode==='quick'?55:100);controlNext()}
function controlNext(){if(done||!CONTROL_TASKS.includes(task)||!controlQueue.length){if(!done)finishTask();return}let x=controlQueue.shift(),shown=now();controlItem=x;let expected=controlRender(x,false,(v,e)=>controlRecord(x,v,e,shown), (v,e)=>controlRecord(x,v,e,shown));controlTimer=setTimeout(()=>controlRecord(x,'none',expected,shown,true),level===1?2200:level===2?1800:1500)}function controlRecord(x,value,expected,shown,omission=false){if(controlItem!==x)return;controlItem=null;clearTimeout(controlTimer);let correct=!omission&&value===expected,extra=task==='stroop_control'?{word_meaning:COLORS[x.word][0],font_color:COLORS[x.color][0],congruency:x.congruency,trial_type:x.congruency,stimulus_payload:{word_meaning:COLORS[x.word][0],font_color:COLORS[x.color][0],congruency:x.congruency}}:task==='task_switching'?{current_rule:x.rule,previous_rule:x.previous_rule,switch_condition:x.switch_condition,stimulus_number:x.number,trial_type:x.switch_condition,perseveration_error:!correct&&x.previous_rule&&((x.previous_rule==='parity'?(x.number%2?'left':'right'):(x.number<5?'left':'right'))===value),stimulus_payload:{current_rule:x.rule,previous_rule:x.previous_rule,switch_condition:x.switch_condition,stimulus_number:x.number}}:{symbol_id:SYMBOLS[x.symbol][0],expected_digit:expected,mapping_id:controlMapId,trial_type:'symbol_match',stimulus_payload:{symbol_id:SYMBOLS[x.symbol][0],expected_digit:expected,mapping_id:controlMapId}};noteTrial({stimulus_type:task,expected_response:expected,actual_response:value,response_time_ms:omission?null:now()-shown,correct,omission,difficulty_level:level,...extra});hint.textContent=correct?'正确':omission?'请更快作答':'再确认规则';setTimeout(controlNext,140)}
startTask=function(){clearPracticeShell();cc();task=cfg.task_types[taskIndex];trials=[];level=1;taskStart=now();label.textContent=`${taskIndex+1} / ${cfg.task_types.length} · ${names[task]||task}`;title.textContent=names[task]||task;hint.textContent='';stage.innerHTML='';if(CONTROL_TASKS.includes(task))return controlIntro();let sec=cfg.session_mode==='quick'?25:45;if(task==='focus_target')targetPractice(sec);else if(task==='focus_gonogo')gonogo(sec);else practiceTask(sec)};
</script><script src="control_speed_hotfix.js"></script></body></html>
