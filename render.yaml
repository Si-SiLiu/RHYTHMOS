services:
  - type: web
    name: rhythmos-polar-sync
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT src.mobile_sync_server:app
    healthCheckPath: /healthz
    disk:
      name: rhythmos-polar-sync-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: POLAR_TOKEN_FILE
        value: /opt/render/project/src/data/polar_tokens.enc
      - key: POLAR_CLIENT_ID
        sync: false
      - key: POLAR_CLIENT_SECRET
        sync: false
      - key: POLAR_REDIRECT_URI
        sync: false
      - key: POLAR_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MOBILE_SYNC_API_TOKEN
        sync: false
      - key: POLAR_CONNECT_PASSWORD
        sync: false
      - key: POLAR_CONNECT_USERNAME
        value: owner
      - key: FLASK_SECRET_KEY
        generateValue: true
